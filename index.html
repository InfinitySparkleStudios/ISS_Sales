<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Keepsake · Infinity Sparkle Studios</title>
<meta name="description" content="Your private keepsake for the story behind your jewellery, by Infinity Sparkle Studios.">

<style>
:root{
  --bg:#f7f3ec; --surface:#fffdf9; --surface-2:#f1ebe0; --ink:#1f1b2e; --ink-2:#5b5568; --line:#e4dccd;
  --gold:#a8843f; --gold-soft:#efe3c9; --rose:#b5677a; --danger:#b3412f; --ok:#3d7a57;
  --shadow:0 1px 2px rgba(31,27,46,.06),0 8px 24px rgba(31,27,46,.07);
  --r:16px; --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15121f; --surface:#1e1a2b; --surface-2:#272236; --ink:#f3eee6; --ink-2:#b4adbf; --line:#342e45;
  --gold:#d4b06a; --gold-soft:#3a3226; --rose:#e09aab; --danger:#ef7d6a; --ok:#7cc59a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#15121f; --surface:#1e1a2b; --surface-2:#272236; --ink:#f3eee6; --ink-2:#b4adbf; --line:#342e45;
  --gold:#d4b06a; --gold-soft:#3a3226; --rose:#e09aab; --danger:#ef7d6a; --ok:#7cc59a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0}
a{color:var(--gold)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 22px;font-weight:500;cursor:pointer;background:var(--ink);color:var(--bg);transition:transform .08s,opacity .2s;min-height:46px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;min-height:36px;font-size:.9rem}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:.82rem;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;outline:none;min-height:46px}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
textarea.input{min-height:110px;resize:vertical}
.pin{letter-spacing:.5em;text-align:center;font-size:1.4rem}
.err{color:var(--danger);font-size:.9rem;min-height:1.3em;margin:4px 0 10px}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;padding:6px 0}
.toggle input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked{background:var(--gold)}
.toggle input:checked::after{left:21px}

/* entry screens */
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
.gate .card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px 24px;max-width:420px;width:100%;box-shadow:var(--shadow);text-align:left}
.gate h1{font-size:2.3rem;text-align:center;margin:6px 0 8px}
.gate .lead{text-align:center;color:var(--ink-2);margin:0 0 22px}
.ring{width:64px;height:64px;margin:0 auto 10px;display:block}
.brand-foot{margin-top:22px;font-size:.8rem;color:var(--ink-2);text-align:center}
.brand-foot a{color:var(--ink-2)}

/* header */
.hero{padding:calc(env(safe-area-inset-top) + 28px) 0 18px;text-align:center}
.hero h1{font-size:2.4rem}
.hero .sub{color:var(--ink-2);margin-top:4px}
.tabs{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:14px 12px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;min-width:72px}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
main{padding:20px 0 120px}

/* timeline */
.timeline{position:relative;margin-left:8px;padding-left:24px;border-left:1px solid var(--line)}
.moment{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:16px;box-shadow:var(--shadow);cursor:pointer}
.moment::before{content:"";position:absolute;left:-31px;top:20px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.moment .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--gold-soft);color:var(--ink);font-size:.76rem;font-weight:500}
.moment h3{font-size:1.45rem;margin:6px 0 4px}
.moment p{margin:0;color:var(--ink-2);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.private{font-size:.74rem;color:var(--ink-2)}

/* photos */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;white-space:nowrap;cursor:pointer;font-size:.88rem}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.grid button{padding:0;border:0;background:var(--surface-2);border-radius:10px;overflow:hidden;aspect-ratio:1;cursor:pointer}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-2);background:var(--surface);margin-bottom:16px;cursor:pointer}

/* piece */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2{font-size:1.6rem;margin-bottom:10px}
.piece-photo{width:100%;max-height:360px;object-fit:cover;border-radius:12px;margin-bottom:14px;background:var(--surface-2)}
dl.specs{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dl.specs dt{color:var(--ink-2);font-size:.88rem}
dl.specs dd{margin:0;font-weight:500}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--gold-soft);border-radius:12px;padding:14px;margin-bottom:12px}
.care{white-space:pre-wrap;margin:0}

/* empty */
.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty h3{font-size:1.6rem;color:var(--ink);margin-bottom:6px}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}

/* fab */
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:20;border:0;border-radius:99px;background:var(--gold);color:#fff;padding:15px 22px;font-weight:600;box-shadow:0 8px 24px rgba(168,132,63,.4);cursor:pointer;display:flex;gap:8px;align-items:center}

/* sheet / modal */
.overlay{position:fixed;inset:0;background:rgba(15,12,22,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 22px)}
@media(min-width:640px){.sheet{border-radius:22px}}
.sheet h2{font-size:1.8rem;margin-bottom:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.cats button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.lightbox{position:fixed;inset:0;background:#0d0b12;z-index:50;display:flex;flex-direction:column}
.lightbox .lb-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .lb-bar{background:var(--surface);padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:52vh;overflow:auto}
.lb-top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between}
.lb-top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:8px 14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-size:.92rem;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--gold);width:0;transition:width .2s}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.share-box{display:flex;gap:8px;margin-top:10px}
.share-box input{flex:1}
footer.sig{text-align:center;color:var(--ink-2);font-size:.8rem;padding:24px 0 8px}
footer.sig a{color:var(--ink-2)}
/* event / wedding */
.cover{width:100%;height:260px;object-fit:cover;display:block}
.ev-hero{text-align:center;padding:28px 16px 8px}
.ev-hero h1{font-size:2.6rem}
.ev-date{font-family:var(--serif);font-size:1.3rem;color:var(--gold);margin-top:6px}
.prog{list-style:none;margin:0;padding:0}
.prog li{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.prog li:last-child{border-bottom:0}
.prog .t{min-width:64px;font-weight:600;color:var(--gold)}
.prow{display:flex;gap:8px;margin-bottom:8px}
.prow .input:first-child{flex:0 0 96px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.8rem;line-height:1}
.glist{display:flex;flex-direction:column}
.grow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.grow .nm{flex:1;min-width:0}
.badge{font-size:.74rem;padding:2px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.yes{background:#dcefe3;color:#24563a}.badge.no{background:#f4dcd6;color:#7a2a1d}
.match{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.match:hover{border-color:var(--gold)}
.qrwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrwrap #gqr{background:#fff;padding:8px;border-radius:10px}
#printArea{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
}
.tcard{border:0.3mm dashed #bbb;height:130mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4mm;text-align:center;padding:8mm;font-family:var(--sans);color:#1f1b2e;break-inside:avoid}
.tcard h3{font-family:var(--serif);font-size:24pt;margin:0;color:#1f1b2e}
.tcard .q img,.tcard .q canvas{width:55mm!important;height:55mm!important}
.tcard p{margin:0;font-size:11pt}
</style>

<body>

<div id="app"><div class="spinner" aria-label="Loading"></div></div>
<div id="layer"></div>
<div id="printArea"></div>

<script>
/* ===== Config ===== */
const SB_URL = "https://zyxwadchlypfkwkqprdm.supabase.co";
const SB_KEY = "sb_publishable_mwmgwUsAB7cPI4F1T0AyjA_qOsVfe2A";
const FN = SB_URL + "/functions/v1/keepsake";
const BRAND = { name: "Infinity Sparkle Studios", email: "info@infinitysstudio.com", phone: "+27 63 698 6806", site: "https://infinitysparklestudios.github.io/ISS_Sales/" };
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });

const CATS = {
  engagement: "Engagement", wedding: "Wedding", honeymoon: "Honeymoon", home: "First home",
  baby: "Baby", anniversary: "Anniversary", travel: "Travels", family: "Family", other: "Special moment",
};

/* ===== Small helpers ===== */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("en-ZA", { day: "numeric", month: "long", year: "numeric" });
}
function toast(msg, ms = 2600) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
async function api(action, payload = {}) {
  const res = await fetch(FN, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SB_KEY },
    body: JSON.stringify({ action, ...payload }),
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) { const e = new Error(data.error || "Something went wrong. Please try again."); e.status = res.status; throw e; }
  return data;
}
const ringSvg = `<svg class="ring" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="38" r="17" stroke="var(--gold)" stroke-width="3"/><path d="M24 14l8-8 8 8-8 8z" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/><path d="M24 14h16" stroke="var(--gold)" stroke-width="1.5"/></svg>`;
const footer = () => `<footer class="sig">Crafted with love by <a href="${BRAND.site}" target="_blank" rel="noopener">${BRAND.name}</a><br>${BRAND.email} · ${BRAND.phone}</footer>`;

/* ===== State ===== */
const params = new URLSearchParams(location.search);
let S = { code: null, session: null, data: null, tab: null, photoFilter: "all" };

/* ===== Routing ===== */
async function boot() {
  const share = params.get("s");
  if (share) return renderShared(share);
  const ev = params.get("e");
  if (ev) return renderEvent(ev);
  let code = params.get("k") || store.get("ks_last_code");
  if (!code) return renderEnterCode();
  S.code = code;
  store.set("ks_last_code", code);
  if (params.get("k")) history.replaceState(null, "", location.pathname); // keep the card code out of the address bar
  S.session = store.get("ks_sess_" + code);
  if (S.session) {
    try { await loadVault(); return; } catch (e) { if (e.status !== 401) return renderError(e.message); store.del("ks_sess_" + code); S.session = null; }
  }
  try {
    const st = await api("vault_status", { code });
    st.pin_set ? renderUnlock(st) : renderSetPin(st);
  } catch (e) {
    if (e.status === 404) { store.del("ks_last_code"); }
    renderError(e.message, true);
  }
}

function renderError(msg, offerCode) {
  $("#app").innerHTML = `<div class="gate"><div class="card">${ringSvg}<h1>Hmm…</h1><p class="lead">${esc(msg)}</p>
  ${offerCode ? `<button class="btn ghost block" id="tryCode">Enter a card code</button>` : `<button class="btn block" onclick="location.reload()">Try again</button>`}
  <p class="brand-foot">Need help? ${BRAND.email} · ${BRAND.phone}</p></div></div>`;
  $("#tryCode")?.addEventListener("click", renderEnterCode);
}

function renderEnterCode() {
  $("#app").innerHTML = `<div class="gate"><div class="card">${ringSvg}
    <p class="eyebrow" style="text-align:center">${BRAND.name}</p>
    <h1>Our Keepsake</h1>
    <p class="lead">Scan the QR code on your keepsake card, or type the code printed underneath it.</p>
    <form id="f"><label class="field"><span>Card code</span><input class="input" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
    <div class="err" id="err"></div><button class="btn block">Continue</button></form>
    <p class="brand-foot">A private home for the story behind your jewellery.</p></div></div>`;
  $("#f").onsubmit = (e) => {
    e.preventDefault();
    const c = $("#code").value.trim().replace(/\s+/g, "");
    if (!c) return;
    location.href = location.pathname + "?k=" + encodeURIComponent(c);
  };
}

function renderSetPin(st) {
  $("#app").innerHTML = `<div class="gate"><div class="card">${ringSvg}
    <p class="eyebrow" style="text-align:center">Welcome</p>
    <h1>${esc(st.couple_names || "Your keepsake")}</h1>
    <p class="lead">${st.piece_name ? `This is the private home for your <b>${esc(st.piece_name)}</b>. ` : ""}Choose a 6–8 digit PIN. You and your partner will use it to open your keepsake.</p>
    <form id="f">
      <label class="field"><span>Choose a PIN</span><input class="input pin" id="p1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" required></label>
      <label class="field"><span>Type it again</span><input class="input pin" id="p2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" required></label>
      <div class="err" id="err"></div>
      <button class="btn gold block" id="go">Create my keepsake</button>
    </form>
    <p class="brand-foot">Keep your PIN somewhere safe. If you forget it, ${BRAND.name} can reset it for you.</p></div></div>`;
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const p1 = $("#p1").value, p2 = $("#p2").value, err = $("#err");
    if (!/^\d{6,8}$/.test(p1)) return (err.textContent = "Your PIN must be 6 to 8 digits.");
    if (p1 !== p2) return (err.textContent = "The two PINs don't match.");
    $("#go").disabled = true;
    try {
      const r = await api("set_pin", { code: S.code, pin: p1 });
      S.session = r.session; store.set("ks_sess_" + S.code, r.session);
      await loadVault(); toast("Your keepsake is ready ✨");
    } catch (ex) { err.textContent = ex.message; $("#go").disabled = false; }
  };
}

function renderUnlock(st) {
  $("#app").innerHTML = `<div class="gate"><div class="card">${ringSvg}
    <p class="eyebrow" style="text-align:center">Our Keepsake</p>
    <h1>${esc(st.couple_names || "Welcome back")}</h1>
    <p class="lead">Enter your PIN to open your keepsake.</p>
    <form id="f">
      <label class="field"><span>PIN</span><input class="input pin" id="p" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" required autofocus></label>
      <div class="err" id="err"></div>
      <button class="btn block" id="go">Open</button>
    </form>
    <p class="brand-foot">Forgot your PIN? Contact ${BRAND.email} or ${BRAND.phone}.</p></div></div>`;

async function loadVault() {
  S.data = await api("get_vault", { session: S.session });
  renderVault();
}
async function refresh() {
  try { S.data = await api("get_vault", { session: S.session }); renderVault(); }

function isEvent(v) { return v.kind && v.kind !== "jewellery"; }

  if (!isEvent(v)) return [["story", "Our story"], ["photos", "Photos"], ["piece", "Our piece"], ["more", "Settings"]];
  const t = [["wedding", v.kind === "wedding" ? "Our wedding" : "Our event"], ["guests", "Guests"], ["photos", "Photos"], ["story", "Our story"]];
  if (v.piece_name) t.push(["piece", "Our rings"]);
  t.push(["more", "Settings"]);
  return t;
}
function applyTheme(c) { if (c && /^#[0-9a-f]{6}$/i.test(c)) document.documentElement.style.setProperty("--gold", c); }

function renderVault() {
  const v = S.data.vault;

  const L = $("#layer");

  const ov = $("#ov");
  if (cls === "overlay") ov.addEventListener("click", (e) => { if (e.target === ov) closeLayer(); });
  return ov;
}

/* ===== Photo upload ===== */
function pickPhotos(milestoneId) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
  inp.onchange = () => inp.files.length && uploadPhotos([...inp.files].slice(0, 20), milestoneId);
  inp.click();
}

function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Couldn't read " + file.name)); };
    img.src = url;
  });
}
function resize(img, max, q) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob(r, "image/jpeg", q));
}

async function uploadPhotos(files, milestoneId) {
  const m = milestoneId ? S.data.milestones.find((x) => x.id === milestoneId) : null;
  openLayer(`<div class="sheet"><h2>Saving photos…</h2><p class="muted" id="ust">Preparing ${files.length} photo${files.length > 1 ? "s" : ""}${m ? " for “" + esc(m.title) + "”" : ""}</p><div class="progress"><div id="ubar"></div></div></div>`);
  const shared = m ? m.is_shared : true;
  let done = 0, failed = 0;
  try {
    const { uploads } = await api("photo_upload_urls", { session: S.session, count: files.length });
    for (let i = 0; i < files.length; i++) {
      $("#ust").textContent = `Uploading ${i + 1} of ${files.length}…`;
      try {
        const img = await loadImage(files[i]);
        const [full, thumb] = await Promise.all([resize(img, 2000, 0.86), resize(img, 480, 0.8)]);
        const u = uploads[i];
        const a = await sb.storage.from("keepsake").uploadToSignedUrl(u.path, u.token, full, { contentType: "image/jpeg" });
        if (a.error) throw a.error;
        const b = await sb.storage.from("keepsake").uploadToSignedUrl(u.thumb_path, u.thumb_token, thumb, { contentType: "image/jpeg" });
        if (b.error) throw b.error;
        await api("photo_confirm", { session: S.session, path: u.path, thumb_path: u.thumb_path, milestone_id: milestoneId, is_shared: shared });
        done++;
      } catch (e) { console.error(e); failed++; }
      $("#ubar").style.width = Math.round(((i + 1) / files.length) * 100) + "%";
    }
  } catch (e) { closeLayer(); return toast(e.message, 4000); }
  closeLayer();
  await refresh();
  toast(failed ? `${done} saved, ${failed} couldn't be uploaded` : `${done} photo${done > 1 ? "s" : ""} saved 💛`);
}

function progRow(p) {
  return `<div class="prow"><input class="input" data-t maxlength="20" placeholder="15:00" value="${esc(p.time || "")}"><input class="input" data-n maxlength="120" placeholder="Ceremony" value="${esc(p.title || "")}"><button type="button" class="btn ghost sm" data-delp aria-label="Remove line">✕</button></div>`;

function printTableCards(v, link) {

/* ===== Couple: guest list ===== */
async function viewGuests() {

  $("#view").innerHTML = `

      <div class="err" id="gerr"></div><button class="btn gold sm" id="gadd">Add to guest list</button></form></section>
    <section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">Guest list (${guests.length})</h2>

    e.preventDefault();
    const rows = $("#gnames").value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {

function guestPick() {
  let name = store.get("ks_guest_name") || "";
  openLayer(`<div class="sheet"><div class="sheet-head"><h2 style="margin:0">Add your photos</h2><button class="x" aria-label="Close" onclick="closeLayer()">✕</button></div>
    <form id="gpf" style="margin-top:12px"><label class="field"><span>Your name (so the couple know who shared)</span><input class="input" id="gpn" maxlength="80" value="${esc(name)}" autocomplete="name"></label>
    <button class="btn gold block">Choose photos</button><p class="small muted" style="text-align:center">Up to 10 at a time.</p></form></div>`);
  $("#gpf").onsubmit = (e) => {
    e.preventDefault(); name = $("#gpn").value.trim(); store.set("ks_guest_name", name);
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
    inp.onchange = () => inp.files.length && guestUpload([...inp.files].slice(0, 10), name);
    inp.click();
  };
}

async function guestUpload(files, name) {
  openLayer(`<div class="sheet"><h2>Sharing your photos…</h2><p class="muted" id="ust">Preparing ${files.length} photo${files.length > 1 ? "s" : ""}</p><div class="progress"><div id="ubar"></div></div></div>`);
  let done = 0, failed = 0;
  try {
    const { uploads } = await api("guest_upload_urls", { token: EVT, count: files.length });
    for (let i = 0; i < files.length; i++) {
      $("#ust").textContent = `Uploading ${i + 1} of ${files.length}…`;
      try {
        const img = await loadImage(files[i]);
        const [full, thumb] = await Promise.all([resize(img, 1600, 0.82), resize(img, 480, 0.78)]);
        const u = uploads[i];
        const a = await sb.storage.from("keepsake").uploadToSignedUrl(u.path, u.token, full, { contentType: "image/jpeg" });
        if (a.error) throw a.error;
        const b = await sb.storage.from("keepsake").uploadToSignedUrl(u.thumb_path, u.thumb_token, thumb, { contentType: "image/jpeg" });
        if (b.error) throw b.error;
        await api("guest_photo_confirm", { token: EVT, path: u.path, thumb_path: u.thumb_path, uploaded_by: name });
        done++;
      } catch (e) { console.error(e); failed++; }
      $("#ubar").style.width = Math.round(((i + 1) / files.length) * 100) + "%";
    }
  } catch (e) { closeLayer(); return toast(e.message, 4000); }
  closeLayer();
  toast(failed ? `${done} shared, ${failed} couldn't be uploaded` : `Thank you! ${done} photo${done > 1 ? "s" : ""} shared 💛`);
  renderEvent(EVT, "wall");
}

      <main class="wrap" style="padding-top:8px">
        ${d.piece_photo ? `<img class="piece-photo" src="${esc(d.piece_photo)}" alt="">` : ""}
        ${d.milestones.length ? `<div class="timeline">${d.milestones.map((m) => { const ph = byM(m.id); return `<article class="moment" style="cursor:default">
          <div class="meta"><span class="chip">${esc(CATS[m.category] || "Moment")}</span>${m.event_date ? `<span>${fmtDate(m.event_date)}</span>` : ""}</div>
          <h3>${esc(m.title)}</h3>${m.notes ? `<p style="-webkit-line-clamp:unset">${esc(m.notes)}</p>` : ""}
          ${ph.length ? `<div class="grid" style="margin-top:12px">${ph.map((p) => `<button data-p="${p.id}"><img loading="lazy" src="${esc(p.thumb)}" alt=""></button>`).join("")}</div>` : ""}
        </article>`; }).join("")}</div>` : ""}
        ${loose.length ? `<h2 style="font-size:1.6rem;margin:20px 0 10px">More photos</h2><div class="grid">${loose.map((p) => `<button data-p="${p.id}"><img loading="lazy" src="${esc(p.thumb)}" alt=""></button>`).join("")}</div>` : ""}
        ${!d.milestones.length && !d.photos.length ? `<div class="empty"><h3>Nothing shared yet</h3><p>Check back soon.</p></div>` : ""}
        ${footer()}
      </main>`;
    document.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => {
      let idx = d.photos.findIndex((p) => p.id === b.dataset.p);
      const draw = () => {
        const p = d.photos[idx];
        openLayer(`<div class="lb-top"><button id="lbx">✕ Close</button><span>${d.photos.length > 1 ? `<button id="lbp">‹</button> <button id="lbn">›</button>` : ""}</span></div>
          <div class="lb-img"><img src="${esc(p.url)}" alt=""></div>${p.caption ? `<div class="lb-bar"><p style="margin:0">${esc(p.caption)}</p></div>` : ""}`, "lightbox");
        $("#lbx").onclick = closeLayer;
        $("#lbp")?.addEventListener("click", () => { idx = (idx - 1 + d.photos.length) % d.photos.length; draw(); });
        $("#lbn")?.addEventListener("click", () => { idx = (idx + 1) % d.photos.length; draw(); });
      };
      draw();
    });
  } catch (e) { renderError(e.message); }
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
</body>
</html>
